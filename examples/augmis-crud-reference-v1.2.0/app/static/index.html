<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUGMIS · Sample Records</title><style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#17212b;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}header{padding:18px 4%;background:#fff;border-bottom:1px solid #d9e0e5;display:flex;justify-content:space-between;gap:15px;align-items:center}header strong{color:#1f5f8b;font-size:22px}header span{color:#66727d;font-size:12px}.wrap{max-width:1200px;margin:30px auto;padding:0 20px}h1{font-size:25px;margin:0 0 7px}p{color:#66727d;margin:0 0 22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}.stat,.panel{border:1px solid #d9e0e5;background:white;padding:18px;border-radius:4px}.stat label{display:block;font-size:12px;color:#66727d;margin-bottom:7px}.stat b{font-size:25px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}.toolbar input{max-width:300px}button{background:#1f5f8b;color:#fff;border:1px solid #1f5f8b;border-radius:4px;padding:10px 14px;font-weight:600;cursor:pointer}button.secondary{background:white;color:#1f5f8b}button.danger{border-color:#a52b2b;color:#a52b2b;background:white}button:disabled{opacity:.5;cursor:default}input,select,textarea{width:100%;padding:10px;border:1px solid #c7d0d8;border-radius:4px;font:inherit;background:#fff}label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th{color:#66727d;text-align:left;background:#f7f9fa;font-size:12px}td,th{padding:12px;border-bottom:1px solid #e4e9ed;white-space:nowrap}td:last-child{display:flex;gap:6px}td button{padding:6px 9px;font-size:12px}#message{min-height:26px;color:#a52b2b;font-size:13px}.modal{position:fixed;inset:0;background:#14202b8a;display:flex;justify-content:center;align-items:center;padding:20px}.modal[hidden]{display:none}.modal>.panel{width:min(560px,100%);max-height:90vh;overflow:auto}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:20px 0}.full{grid-column:1/-1}.actions{display:flex;justify-content:end;gap:10px}#empty{padding:25px;text-align:center;color:#66727d}@media(max-width:650px){.stats{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}header span{display:none}}
</style></head><body><header><strong>AUGMIS <span> / FUNCTIONAL REFERENCE APP</span></strong><span>Sample Records · PostgreSQL CRUD</span></header><main class="wrap"><h1>Sample Records</h1><p>Create, view, edit and soft-delete records. Changes are saved in PostgreSQL and reflected in the summary.</p><section class="stats"><div class="stat"><label>Active records</label><b id="count">—</b></div><div class="stat"><label>Total quantity</label><b id="quantity">—</b></div><div class="stat"><label>Combined value</label><b id="amount">—</b></div></section><div class="toolbar"><input id="search" placeholder="Search by name" aria-label="Search records"><div><button class="secondary" id="refresh">Refresh</button> <button id="new">+ Create record</button></div></div><div id="message" role="status"></div><section class="panel tablewrap"><table><thead><tr><th>Name</th><th>Category</th><th>Quantity</th><th>Unit price</th><th>Total</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" hidden>No records found. Create the first record.</div></section></main><div class="modal" id="modal" hidden><div class="panel"><h2 id="modalTitle">New record</h2><form id="form"><div class="fields"><div class="full"><label for="name">Name *</label><input id="name" name="name" required maxlength="120"></div><div><label for="category">Category *</label><select id="category" name="category" required><option>General</option><option>Equipment</option><option>Materials</option><option>Services</option></select></div><div><label for="quantityInput">Quantity *</label><input id="quantityInput" name="quantity" type="number" min="0" step="1" max="10000000" required value="1"></div><div><label for="unit_price">Unit price *</label><input id="unit_price" name="unit_price" type="number" min="0" step="0.01" required value="0"></div><div class="full"><label for="notes">Notes</label><textarea id="notes" name="notes" rows="3" maxlength="1000"></textarea></div></div><div class="actions"><button class="secondary" type="button" id="cancel">Cancel</button><button id="save" type="submit">Save record</button></div></form></div></div>
<script>
const $=id=>document.getElementById(id);let editing=null;let records=[];
const money=n=>Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
async function request(path,options={}){const response=await fetch(path,{credentials:'same-origin',cache:'no-store',...options});if(response.status===204)return null;const data=await response.json().catch(()=>null);if(!response.ok){const detail=data?.detail;throw Error(typeof detail==='string'?detail:JSON.stringify(detail)||`Request failed (${response.status})`)}return data}
function msg(s){$('message').textContent=s||''}
async function reload(){try{msg('');const [items,stats]=await Promise.all([request('api/records?q='+encodeURIComponent($('search').value)),request('api/summary')]);records=items;$('rows').replaceChildren();$('empty').hidden=items.length>0;for(const r of items){const tr=document.createElement('tr');for(const field of ['name','category','quantity','unit_price','total']){const td=document.createElement('td');td.textContent=['unit_price','total'].includes(field)?money(r[field]):r[field];tr.append(td)}const td=document.createElement('td');for(const [label,action,cls] of [['View','view','secondary'],['Edit','edit','secondary'],['Delete','delete','danger']]){const button=document.createElement('button');button.textContent=label;button.className=cls;button.addEventListener('click',()=>act(action,r.id));td.append(button)}tr.append(td);$('rows').append(tr)}$('count').textContent=stats.count;$('quantity').textContent=stats.quantity;$('amount').textContent=money(stats.amount)}catch(e){msg(e.message)}}
function openForm(record=null,readOnly=false){editing=record?.id||null;$('form').reset();$('modalTitle').textContent=readOnly?'View record':editing?'Edit record':'Create record';for(const key of ['name','category','notes','unit_price'])$(key).value=record?.[key]??(key==='unit_price'?'0':'');$('quantityInput').value=record?.quantity??1;for(const item of $('form').querySelectorAll('input,textarea,select'))item.disabled=readOnly;$('save').hidden=readOnly;$('modal').hidden=false;$('name').focus()}
function closeForm(){$('modal').hidden=true}
async function act(action,id){try{const r=await request('api/records/'+id);if(action==='delete'){if(!confirm('Soft-delete "'+r.name+'"?'))return;await request('api/records/'+id,{method:'DELETE'});await reload()}else openForm(r,action==='view')}catch(e){msg(e.message)}}
$('form').addEventListener('submit',async ev=>{ev.preventDefault();const fd=new FormData(ev.target);const data=Object.fromEntries(fd.entries());data.quantity=Number(data.quantity);try{$('save').disabled=true;await request(editing?'api/records/'+editing:'api/records',{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});closeForm();await reload()}catch(e){msg(e.message)}finally{$('save').disabled=false}});
$('new').addEventListener('click',()=>openForm());$('refresh').addEventListener('click',reload);$('search').addEventListener('input',()=>{clearTimeout(window.searchTimer);window.searchTimer=setTimeout(reload,250)});$('cancel').addEventListener('click',closeForm);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeForm()});reload();
</script></body></html>
