name: AUGMIS B3 Security Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and security tools
        run: |
          python -m pip install -r requirements.txt pytest pip-audit
      - name: Python / runtime security regressions
        env:
          DATABASE_URL: "postgresql+psycopg://ci_user:ci_password@127.0.0.1:5432/augmis_ci"
          JWT_SECRET: "augmis-ci-only-dummy-secret-not-for-production-use-2026"
        run: |
          python -m compileall -q services/api/app tools
          python -m pytest -q tools/test_b3b4_security.py
      - name: Dependency audit (fails on findings)
        run: python -m pip_audit -r requirements.txt
  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
